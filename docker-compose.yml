services:
  postgres:
    image: postgres:16-alpine
    container_name: examflow-postgres
    environment:
      POSTGRES_USER: examflow
      POSTGRES_PASSWORD: examflow_dev
      POSTGRES_DB: examflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U examflow"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
